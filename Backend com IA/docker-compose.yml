services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: meetup_db
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - meetup-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=meetup_db;User=root;Password=${MYSQL_ROOT_PASSWORD}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - meetup-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  meetup-net:
    driver: bridge

volumes:
  mysql-data:
